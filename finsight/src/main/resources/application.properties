# Application
spring.application.name=finsight

# Database - MySQL (default)
# Set these via environment variables or override this file locally (never commit real credentials)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finsight?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
# REQUIRED: Set JWT_SECRET environment variable in production (min 32 chars for HS256).
# The placeholder below will cause startup to fail if not overridden, enforcing explicit configuration.
jwt.secret=${JWT_SECRET:CHANGE-ME-this-placeholder-is-32ch}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Redis (optional - comment out if not using Redis)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.cache.type=redis
